openapi: 3.0.3

info:
  title: MuchoCore API v2
  version: "2.2"
  description: |
    JSON API for MuchoCore.
    Copyright (C) 2026 IZK.

servers:
  - url: https://gdps.example.com

paths:

  /api/v2/health:
    get:
      summary: MuchoCore health
      responses:
        "200":
          description: Healthy

  /api/v2/profile/{accountId}:
    get:
      summary: Public Mucho profile
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
        "404":
          description: Profile not found

  /api/v2/dashboard:
    get:
      summary: Public GDPS statistics
      responses:
        "200":
          description: Dashboard data

  /api/v2/music:
    get:
      summary: Music list
      responses:
        "200":
          description: Songs

  /api/v2/music-library.php:
    get:
      summary: Browse approved MuchoCore tracks for use in levels
      parameters:
        - name: op
          in: query
          required: true
          schema:
            type: string
            enum: [catalog, track, level, newgrounds]
        - name: id
          in: query
          description: MuchoCore track ID, level ID, or Newgrounds Audio ID, depending on op.
          schema:
            type: integer
            minimum: 1
        - name: after
          in: query
          description: Use next_after from the previous catalog response until it is null.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: |
            Version 1 JSON. Catalog returns tracks and next_after. Track and
            Newgrounds lookup return a track with an MP3 SHA-256. Level lookup
            returns level_id and a track with SHA-256, or a null track for built-in music.
            Track objects include id, title, artist, bytes, a local MP3 url and an
            optional source object with provider, id, and the original track url.
        "400":
          description: Invalid cursor or ID
        "404":
          description: Unknown operation or unavailable track or level
        "503":
          description: Catalog unavailable

  /api/v2/music-upload.php:
    post:
      summary: Upload MP3 for moderation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [account_id, title, artist, file]
              properties:
                account_id:
                  type: integer
                gjp2:
                  type: string
                  description: Account credential, or supply gjp for a compatible legacy account.
                gjp:
                  type: string
                title:
                  type: string
                  maxLength: 128
                artist:
                  type: string
                  maxLength: 128
                file:
                  type: string
                  format: binary
                newgrounds_source:
                  type: string
                  description: Optional Newgrounds Audio ID or original track URL for an authorized MP3.
      responses:
        "201":
          description: Song created
        "429":
          description: Rate limited

  /api/v2/heartbeat:
    post:
      summary: Client presence heartbeat
      responses:
        "200":
          description: Presence updated
        "401":
          description: Invalid token
        "429":
          description: Rate limited

  /api/v2/client-config:
    get:
      summary: Client versions and feature flags
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            enum:
              - android
              - windows

        - name: version
          in: query
          schema:
            type: string

      responses:
        "200":
          description: Client configuration
