# Override for NAT VPS deployments without a dedicated public IPv4.
# Used together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --build
#
# In this mode Cloudflare Tunnel opens an outbound connection from this
# server to Cloudflare's edge, so no inbound port forwarding (80/443) is
# required at all — this works behind any NAT/CGNAT VPS.
# Cloudflare terminates TLS; Caddy only needs to serve plain HTTP internally.
services:
  caddy:
    ports: !override
      # Only exposed on localhost, used for local health checks.
      # Not reachable from the internet — Cloudflare Tunnel is the only
      # ingress path in this mode.
      - "127.0.0.1:80:80"

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    # Prefer HTTP/2 over TCP for predictable operation on VPS networks where
    # QUIC/UDP is unstable or filtered. Cloudflare supports both transports.
    entrypoint: ["/bin/sh", "/usr/local/bin/muchocore-cloudflared"]
    volumes:
      - ./docker/cloudflared-entrypoint.sh:/usr/local/bin/muchocore-cloudflared:ro
    environment:
      MUCHO_TUNNEL_TOKEN: ${MUCHO_TUNNEL_TOKEN}
      CLOUDFLARED_METRICS: 127.0.0.1:20241
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready", "--metrics", "127.0.0.1:20241"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      - caddy
