; MuchoCore conservative PHP-FPM performance settings.
; Validate source timestamps: both VPS and shared-hosting workflows can
; update bind-mounted PHP code without recreating the FPM container.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1

; Cache resolved filesystem paths for Composer autoload/plugin discovery.
realpath_cache_size=4096K
realpath_cache_ttl=120
