name: Build MuchoClient Geode (Windows and Android)

on:
  push:
    branches:
      - codex/muchoclient-v092-performance
      - feat/muchoclient-geode-bridge
      - feature/muchoclient-v0.4.0-clans
      - feature/muchoclient-v0.5.0-clan-leaderboards
      - feature/muchoclient-v0.6.0-colors
      - feature/muchoclient-v0.7.0-quests
      - feature/muchoclient-v0.8.0-profile
    paths:
      - 'clients/geode/muchoclient/**'
      - 'clients/launcher/**'
      - 'src/Social/**'
      - 'src/Media/**'
      - 'tests/application/message-images.php'
      - 'database/migrations/20261014_001_message_media.php'
      - 'src/Creator/**'
      - 'plugins/builtin/mucho-creator-hub/**'
      - 'tests/application/creator-hub.php'
      - 'database/migrations/20261013_002_creator_hub.php'
      - 'tests/application/social-live.php'
      - 'database/migrations/20261013_001_social_live.php'
      - '.github/workflows/build-muchoclient.yml'
      - 'src/Clan/**'
      - 'src/Appearance/**'
      - 'database/migrations/20261010_001_appearance.php'
      - 'database/migrations/20261010_002_clan_quests.php'
      - 'database/migrations/20261011_001_profile_media.php'
      - 'tests/application/profile-images.php'
      - 'docker/Dockerfile'
      - 'src/User/UserService.php'
      - 'tests/client/muchoclient-clan-rules.cpp'
      - 'tests/application/clan-client-integration.php'
  pull_request:
    paths:
      - 'clients/geode/muchoclient/**'
      - 'clients/launcher/**'
      - 'src/Social/**'
      - 'src/Media/**'
      - 'tests/application/message-images.php'
      - 'database/migrations/20261014_001_message_media.php'
      - 'src/Creator/**'
      - 'plugins/builtin/mucho-creator-hub/**'
      - 'tests/application/creator-hub.php'
      - 'database/migrations/20261013_002_creator_hub.php'
      - 'tests/application/social-live.php'
      - 'database/migrations/20261013_001_social_live.php'
      - '.github/workflows/build-muchoclient.yml'
      - 'src/Clan/**'
      - 'src/Appearance/**'
      - 'database/migrations/20261010_001_appearance.php'
      - 'database/migrations/20261010_002_clan_quests.php'
      - 'database/migrations/20261011_001_profile_media.php'
      - 'tests/application/profile-images.php'
      - 'docker/Dockerfile'
      - 'src/User/UserService.php'
      - 'tests/client/muchoclient-clan-rules.cpp'
      - 'tests/application/clan-client-integration.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clan-tests:
    name: Clan API integration and client rules
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mucho-clan-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, gd, mbstring, curl
      - name: Test client validation and role permissions
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-clan-rules.cpp -o /tmp/clan-rules
          /tmp/clan-rules
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-daily-quest-rules.cpp -o /tmp/daily-quest-rules
          /tmp/daily-quest-rules
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-layout-rules.cpp -o /tmp/layout-rules
          /tmp/layout-rules
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-motion-rules.cpp -o /tmp/motion-rules
          /tmp/motion-rules
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-performance.cpp -o /tmp/client-performance
          /tmp/client-performance
          g++ -std=c++20 -Wall -Wextra -Werror tests/client/muchoclient-emoji.cpp -o /tmp/client-emoji
          /tmp/client-emoji
          python3 clients/geode/muchoclient/build-emoji-assets.py --index-only
          git diff --exit-code clients/geode/muchoclient/src/MuchoEmojiData.hpp
      - name: Test authenticated clan lifecycle against MariaDB
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_ROOT_PASSWORD: mucho-clan-ci
        run: |
          php tests/application/profile-images.php
          php tests/application/clan-client-integration.php
          php tests/application/daily-quest-integration.php
          php tests/application/social-live.php
          php tests/application/creator-hub.php
          php tests/application/message-images.php
          php tests/application/media-moderator.php

  emoji-assets:
    name: Build pinned offline emoji atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify Twemoji atlas
        run: |
          python -m pip install Pillow==11.3.0
          python clients/geode/muchoclient/build-emoji-assets.py
          git diff --exit-code clients/geode/muchoclient/src/MuchoEmojiData.hpp
      - uses: actions/upload-artifact@v4
        with:
          name: MuchoClient-Emoji-Assets
          path: clients/geode/muchoclient/resources/emoji-*
          if-no-files-found: error

  geode-build:
    name: ${{ matrix.platform.name }}
    needs: [emoji-assets]
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: Windows x64, runner: windows-latest, target: Win64}
          - {name: Android ARM64, runner: ubuntu-latest, target: Android64}
          - {name: Android ARMv7, runner: ubuntu-latest, target: Android32}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MuchoClient-Emoji-Assets
          path: clients/geode/muchoclient/resources

      # The official action configures the repository root as the Geode
      # CMake project. Overlay only source/metadata in the CI workspace;
      # no tracked core PHP files are modified by this step.
      - name: Stage standalone Geode project
        shell: bash
        run: |
          cp clients/geode/muchoclient/CMakeLists.txt CMakeLists.txt
          cp clients/geode/muchoclient/mod.json mod.json
          cp clients/geode/muchoclient/README.md README.md
          cp clients/geode/muchoclient/CHANGELOG.md CHANGELOG.md
          cp clients/geode/muchoclient/src/*.cpp src/
          cp clients/geode/muchoclient/src/*.hpp src/
          mkdir -p resources
          cp clients/geode/muchoclient/resources/emoji-* resources/
          test -f CMakeLists.txt
          test -f mod.json
          test -f src/main.cpp

      - name: Compile MuchoClient
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.platform.target }}
          sdk: given
          build-config: Release
          use-lto: false
          combine: true

  geode-package:
    name: Combine Windows and Android .geode
    needs: [geode-build, clan-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Combine compatible native builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: package

      - name: Upload complete MuchoClient package
        uses: actions/upload-artifact@v4
        with:
          name: MuchoClient-Windows-Android
          path: ${{ steps.package.outputs.build-output }}
          if-no-files-found: error
          retention-days: 30



  launcher:
    name: MuchoLauncher Windows
    needs: geode-package
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: MuchoClient-Windows-Android
          path: client-artifact
      - uses: actions/download-artifact@v4
        with:
          name: MuchoLoader-v0.1.0-Windows
          run-id: 38161767363
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: loader-artifact
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install build dependencies and test launcher core
        run: |
          python -m pip install PySide6==6.8.3 pyinstaller==6.12.0 pefile==2023.2.7
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python clients/launcher/tests/test_engine.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python clients/launcher/tests/test_runtime.py
      - name: Pin native runtime and compile mandatory bootstrap
        shell: cmd
        run: |
          python clients/launcher/prepare.py --loader loader-artifact --client client-artifact --out clients/launcher
          if errorlevel 1 exit /b 1
          copy clients\launcher\pins.h clients\launcher\native\pins.h
          cl /nologo /LD /O2 /utf-8 /MT clients\launcher\native\bootstrap.c advapi32.lib user32.lib /Fe:clients\launcher\MuchoBootstrap.dll
          if errorlevel 1 exit /b 1
          python clients/launcher/prepare.py --loader loader-artifact --client client-artifact --guard clients/launcher/MuchoBootstrap.dll --out clients/launcher
      - name: Package native Windows launcher
        working-directory: clients/launcher
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name MuchoLauncher --add-data "payload.zip;." app.py
          $smoke = Start-Process -FilePath dist/MuchoLauncher/MuchoLauncher.exe -ArgumentList '--screenshot' -Wait -PassThru
          if ($smoke.ExitCode -ne 0 -or !(Test-Path launcher-preview.png)) { throw 'Packaged launcher UI smoke test failed' }
          Copy-Item README-RU.txt dist/MuchoLauncher/README-RU.txt
          Compress-Archive -Path dist/MuchoLauncher -DestinationPath MuchoLauncher-v1.2.0-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MuchoLauncher-Windows
          path: clients/launcher/MuchoLauncher-v1.2.0-Windows.zip
          retention-days: 30
