name: Temporary GD 1.2 APK patch

on:
  push:

jobs:
  inspect-patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP and Android APK tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends android-sdk-build-tools

      - name: Inspect APK
        run: |
          mkdir -p build
          aapt dump badging "Geometry.Dash.ver.1.20.build.7.apk" | tee build-badging.txt

      - name: Patch GD 1.2 APK
        env:
          MUCHO_ANDROID_SIGNER_DIR: ${{ runner.temp }}/muchocore-android-signer
        run: |
          php -r '
            require "src/Client/WindowsClientPatcher.php";
            require "src/Client/AndroidClientPatcher.php";
            $result = MuchoCore\Client\AndroidClientPatcher::patchFile(
                "Geometry.Dash.ver.1.20.build.7.apk",
                "build/Geometry.Dash.ver.1.20.build.7-MuchoCore.apk",
                "https://muchogdps.space"
            );
            file_put_contents("build/patch-report.json", json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
            echo json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          '

      - name: Verify APK output
        run: |
          test -s build/Geometry.Dash.ver.1.20.build.7-MuchoCore.apk
          apksigner verify --verbose build/Geometry.Dash.ver.1.20.build.7-MuchoCore.apk

      - name: Upload patched APK and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: gd12-muchocore-patched
          path: |
            build/Geometry.Dash.ver.1.20.build.7-MuchoCore.apk
            build/patch-report.json
            build-badging.txt
          if-no-files-found: error
