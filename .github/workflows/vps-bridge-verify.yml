name: Validate VPS bridge

on:
  pull_request:
    paths:
      - '.github/workflows/vps-bridge*.yml'
      - 'tools/bridge/**'
      - 'docs/VPS_BRIDGE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-bridge*.yml'
      - 'tools/bridge/**'
      - 'docs/VPS_BRIDGE.md'

permissions:
  contents: read

jobs:
  bridge-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check scripts compile
        run: |
          bash -n tools/bridge/install-vps-bridge.sh
          bash -n tools/bridge/vps-bridge-remote.sh
          python3 -m py_compile tools/bridge/vps-bridge-bench.py tools/bridge/vps-bridge-gd2209.py

      - name: Rejected SSH command never executes shell
        shell: bash
        run: |
          set -euo pipefail
          for bad in '' 'id' 'bash' '/bin/sh' '/vps status' 'status extra' 'status;id' 'smoke && id' 'bench --url=http://example.com'; do
            set +e
            SSH_ORIGINAL_COMMAND="$bad" bash tools/bridge/vps-bridge-remote.sh > /tmp/rejected-bridge.txt 2>&1
            code=$?
            set -e
            if [[ "$code" -ne 64 ]]; then
              printf 'Expected refusal (64), got %s for %q\n' "$code" "$bad" >&2
              exit 1
            fi
            grep -Fq 'REJECTED: only status, smoke, bench, gd2209' /tmp/rejected-bridge.txt
          done

      - name: Require fixed localhost target and no privileged execution
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "127.0.0.1:18080" tools/bridge/vps-bridge-remote.sh
          grep -Fq "127.0.0.1:18080/health" tools/bridge/vps-bridge-bench.py
          grep -Fq "127.0.0.1:18080" tools/bridge/vps-bridge-gd2209.py
          grep -Fq 'ProxyHandler({})' tools/bridge/vps-bridge-gd2209.py
          if grep -nE '(^|[[:space:]])(sudo|docker|eval)[[:space:]]' tools/bridge/vps-bridge-remote.sh; then
            echo 'Remote bridge may not execute sudo, docker or eval.' >&2
            exit 1
          fi
