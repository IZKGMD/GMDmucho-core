name: Build MuchoCore Geometry Dash client

on:
  push:
    branches: [main]
    paths:
      - 'GeometryDash-MuchoCore (1).exe'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch client URLs safely
        shell: python
        run: |
          from pathlib import Path
          import base64
          import hashlib
          import re

          src = Path("GeometryDash-MuchoCore (1).exe")
          out = Path("GeometryDash-MuchoCore.exe")
          original = src.read_bytes()
          data = bytearray(original)

          targets = [
              b"c92935bj.beget.tech",
              b"www.boomlings.com",
              b"boomlings.com",
              b"www.geometrydash.com",
              b"geometrydash.com",
              b"www.gdserver.net",
              b"gdserver.net",
          ]
          replacement = b"muchogdps.space"
          replacements = {}

          def bump(key):
              replacements[key] = replacements.get(key, 0) + 1

          def patch_ascii(data, old, new):
              pos = 0
              count = 0
              while True:
                  i = data.find(old, pos)
                  if i < 0:
                      break

                  start = data.rfind(b"\x00", max(0, i - 256), i) + 1
                  end = data.find(b"\x00", i)
                  if end < 0:
                      end = i + len(old)

                  prefix = bytes(data[start:i])
                  if prefix.endswith((b"http://", b"https://")):
                      url = bytes(data[start:end])
                      patched = url.replace(old, new, 1)
                      if len(patched) > len(url):
                          raise SystemExit(f"Replacement grew URL {url!r}")
                      data[start:end] = patched + b"\x00" * (len(url) - len(patched))
                      bump(old.decode("ascii"))
                      count += 1
                      pos = end
                  else:
                      pos = i + len(old)
              return count

          def patch_utf16(data, old, new):
              old16 = old.decode("ascii").encode("utf-16le")
              new16 = new.decode("ascii").encode("utf-16le")
              zero16 = b"\x00\x00"
              count = 0
              pos = 0
              http = "http://".encode("utf-16le")
              https = "https://".encode("utf-16le")
              while True:
                  i = data.find(old16, pos)
                  if i < 0:
                      break
                  start = data.rfind(zero16, max(0, i - 512), i) + 2
                  end = data.find(zero16, i)
                  if end < 0:
                      end = i + len(old16)
                  prefix = bytes(data[start:i])
                  if prefix.endswith((http, https)):
                      url = bytes(data[start:end])
                      patched = url.replace(old16, new16, 1)
                      if len(patched) > len(url):
                          raise SystemExit(f"Replacement grew UTF-16 URL for {old!r}")
                      data[start:end] = patched + zero16 * ((len(url) - len(patched)) // 2)
                      bump(old.decode("ascii") + " [utf16]")
                      count += 1
                      pos = end
                  else:
                      pos = i + len(old16)
              return count

          def patch_base64_urls(data, old, new):
              changed = 0
              # Base64-encoded ASCII strings are null-terminated in the client.
              for m in list(re.finditer(rb"[A-Za-z0-9+/]{24,}={0,2}", data)):
                  raw = m.group(0)
                  try:
                      decoded = base64.b64decode(raw, validate=True)
                  except Exception:
                      continue
                  if not decoded.startswith((b"http://", b"https://")) or old not in decoded:
                      continue
                  patched_decoded = decoded.replace(old, new, 1)
                  encoded = base64.b64encode(patched_decoded)
                  if len(encoded) > len(raw):
                      raise SystemExit("Base64 replacement grew the embedded string")
                  start, end = m.span()
                  data[start:end] = encoded + b"\x00" * (len(raw) - len(encoded))
                  bump(old.decode("ascii") + " [base64]")
                  changed += 1
              return changed

          for old in targets:
              patch_ascii(data, old, replacement)
              patch_utf16(data, old, replacement)
              patch_base64_urls(data, old, replacement)

          out.write_bytes(data)

          # Validate direct URL strings.
          for old in targets:
              raw = bytes(data)
              i = 0
              while True:
                  i = raw.find(old, i)
                  if i < 0:
                      break
                  start = raw.rfind(b"\x00", max(0, i - 256), i) + 1
                  prefix = raw[start:i]
                  if prefix.endswith((b"http://", b"https://")):
                      raise SystemExit(f"Unpatched hostname remains in URL: {old!r}")
                  i += len(old)

          # Validate embedded Base64 URL strings.
          for m in re.finditer(rb"[A-Za-z0-9+/]{24,}={0,2}", bytes(data)):
              raw = m.group(0)
              try:
                  decoded = base64.b64decode(raw, validate=True)
              except Exception:
                  continue
              if decoded.startswith((b"http://", b"https://")):
                  for old in targets:
                      if old in decoded:
                          raise SystemExit(f"Unpatched Base64 URL remains: {decoded!r}")

          if replacement not in data:
              raise SystemExit("muchogdps.space was not embedded into the final executable")

          output_sha = hashlib.sha256(data).hexdigest()
          input_sha = hashlib.sha256(original).hexdigest()
          lines = [
              "MuchoCore client patch report",
              "==============================",
              *[f"REPLACED {k}: {v}" for k, v in sorted(replacements.items())],
              "",
              f"Input SHA256: {input_sha}",
              f"Output SHA256: {output_sha}",
              f"Size: {len(data)} bytes",
          ]
          Path("client-url-report.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(Path("client-url-report.txt").read_text(encoding="utf-8"))

      - name: Upload patched client
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash-MuchoCore
          path: |
            GeometryDash-MuchoCore.exe
            client-url-report.txt
          if-no-files-found: error
