name: Build MuchoCore Geometry Dash client

on:
  push:
    branches: [main]
    paths:
      - 'GeometryDash-MuchoCore (1).exe'
      - 'tools/client/client-patch.py'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run patcher self-test
        run: python3 tools/client/client-patch.py --self-test

      - name: Patch client with repository tool
        run: |
          python3 tools/client/client-patch.py             --input "GeometryDash-MuchoCore (1).exe"             --output "GeometryDash-MuchoCore.exe"             --server-url "https://muchogdps.space"             --report "client-url-report.txt"

      - name: Upload patched client
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash-MuchoCore
          path: |
            GeometryDash-MuchoCore.exe
            client-url-report.txt
          if-no-files-found: error
