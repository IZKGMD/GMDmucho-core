name: Build FTP and PHP7 native preview ZIPs

on:
  push:
    branches: [main]
    paths:
      - 'compat/php7/**'
      - 'public/php7.php'
      - 'public/php7-setup.php'
      - 'public/php7-admin.php'
      - 'public/assets/php7-admin.css'
      - 'tools/release/build-php7-native.sh'
      - 'tools/release/5v-installer/**'
      - 'tools/client/client-patch.py'
      - 'tools/release/build-shared-hosting.sh'
      - '.github/workflows/php7-preview-archives.yml'
  pull_request:
    paths:
      - 'compat/php7/**'
      - 'public/php7.php'
      - 'public/php7-setup.php'
      - 'public/php7-admin.php'
      - 'public/assets/php7-admin.css'
      - 'tools/release/build-php7-native.sh'
      - 'tools/release/5v-installer/**'
      - 'tools/client/client-patch.py'
      - 'tools/release/build-shared-hosting.sh'
      - '.github/workflows/php7-preview-archives.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare PHP for test and complete package
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, mbstring, pdo_mysql
          tools: composer

      - name: Verify native PHP7.0 source and wire tests
        run: |
          docker run --rm --network none --read-only \
            -v "$GITHUB_WORKSPACE:/app:ro" -w /app \
            php:7.0-cli sh -ec '
              for src in compat/php7/*.php public/php7.php public/php7-setup.php; do
                php -l "$src"
              done
              php tests/compat/php7-native-pure.php
              php tests/compat/php7-native-news.php
              php tests/compat/php7-native-users.php
              php tests/compat/php7-native-features-pure.php
            '
          php tests/compat/php7-native-users-parity.php
          php tests/compat/php7-native-comments-parity.php
          php tests/compat/php7-native-social-parity.php

      - name: Build and inspect native PHP7 5v.pl FTP package
        run: |
          bash -n tools/release/build-php7-native.sh
          python3 -m py_compile tools/release/5v-installer/*.py
          python3 tests/release/test_5v_archive_installer.py
          python3 tests/release/test_5v_client_publisher.py
          python3 tests/release/test_5v_gui_setup.py
          bash tools/release/build-php7-native.sh
          unzip -t MuchoCore-PHP7-5v-native-preview.zip
          for item in mc/compat/php7/users.php INSTALL_5V.py PUBLISH_CLIENTS_5V.py muchoclients5v.py gd_windows_patcher.py GUI_SETUP_5V.py START_GUI_WINDOWS.cmd START_CLIENTS_WINDOWS.cmd; do
            unzip -Z1 MuchoCore-PHP7-5v-native-preview.zip | grep -Fx "$item"
          done
          if unzip -Z1 MuchoCore-PHP7-5v-native-preview.zip | grep -Ei '\.(exe|apk)$'; then
            echo "Do not bundle original copyrighted game binaries" >&2
            exit 1
          fi
          test -s MuchoCore-PHP7-5v-native-preview.zip

      - name: Prepare complete PHP8.2+ core archive
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build and inspect complete PHP8.2+ shared-hosting package
        env:
          OUTPUT: MuchoCore-full-PHP82-shared-hosting.zip
        run: |
          bash tools/release/build-shared-hosting.sh
          unzip -t "$OUTPUT"
          test -s "$OUTPUT"

      - name: Upload standalone PHP7 preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MuchoCore-PHP7-5v-native-preview
          path: MuchoCore-PHP7-5v-native-preview.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete PHP8 shared-hosting ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MuchoCore-full-PHP82-shared-hosting
          path: MuchoCore-full-PHP82-shared-hosting.zip
          if-no-files-found: error
          retention-days: 30

  windows-setup:
    name: Build standalone Windows GUI installer
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download the exact PHP7 payload built by the package job
        uses: actions/download-artifact@v4
        with:
          name: MuchoCore-PHP7-5v-native-preview
          path: payload

      - name: Extract the verified shared-hosting payload
        shell: pwsh
        run: |
          $archive = Get-ChildItem payload -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw "PHP7 payload ZIP was not downloaded" }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath payload\extracted -Force
          foreach ($item in @('mc\admin.php','5V_ROOT_REWRITE_RULES.txt','INSTALL_5V.py','mucho5v.py','PUBLISH_CLIENTS_5V.py','muchoclients5v.py','gd_windows_patcher.py')) {
            if (-not (Test-Path (Join-Path payload\extracted $item))) {
              throw "Missing bundled setup resource: $item"
            }
          }

      - name: Build one-file windowed installer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6.10,<7"
          pyinstaller --noconfirm --clean --onefile --windowed --name MuchoCore-Setup --distpath dist --workpath build\pyinstaller --specpath build\spec --paths payload\extracted --hidden-import gd_windows_patcher --hidden-import INSTALL_5V --hidden-import mucho5v --hidden-import PUBLISH_CLIENTS_5V --hidden-import muchoclients5v --add-data "payload\extracted\mc;mc" --add-data "payload\extracted\5V_ROOT_REWRITE_RULES.txt;." tools\release\5v-installer\GUI_SETUP_5V.py
          if (-not (Test-Path dist\MuchoCore-Setup.exe)) {
            throw "PyInstaller did not create MuchoCore-Setup.exe"
          }
          if ((Get-Item dist\MuchoCore-Setup.exe).Length -lt 10000000) {
            throw "Standalone installer is unexpectedly small; bundled payload may be missing"
          }

      - name: Smoke-test the frozen executable without network access
        shell: pwsh
        run: |
          & .\dist\MuchoCore-Setup.exe --self-test
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen installer self-test failed with exit code $LASTEXITCODE"
          }

      - name: Upload standalone Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MuchoCore-5V-Setup-Windows-x64
          path: dist/MuchoCore-Setup.exe
          if-no-files-found: error
          retention-days: 30

