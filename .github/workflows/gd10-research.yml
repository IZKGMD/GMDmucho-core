name: GD 1.0 APK research

on:
  push:
    branches:
      - research/gd10-compat

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Geometry Dash 1.0 APK
        shell: bash
        run: |
          set -euo pipefail
          apk="Geometry Dash 1.0.apk"
          test -f "$apk"
          rm -rf /tmp/gd10
          mkdir -p /tmp/gd10
          unzip -q "$apk" -d /tmp/gd10
          echo "=== APK size ==="
          stat -c '%s bytes' "$apk"
          echo "=== APK entries ==="
          unzip -Z1 "$apk" | sed -n '1,220p'
          echo "=== URL-like strings ==="
          grep -aRhoE 'https?://[A-Za-z0-9._:/?=&%+~-]+' /tmp/gd10 2>/dev/null | sort -u | sed -n '1,240p' || true
          echo "=== Geometry Dash endpoint-like strings ==="
          grep -aRhoE '[A-Za-z0-9_/-]{2,80}\.php' /tmp/gd10 2>/dev/null | sort -u | sed -n '1,360p' || true
          echo "=== boomlings/robtop strings ==="
          grep -aRiE -n 'boomlings|robtop|GJ[A-Za-z0-9]+' /tmp/gd10 2>/dev/null | head -n 500 || true
          echo "=== 1.0 protocol parameter strings ==="
          strings -a -n 3 /tmp/gd10/lib/armeabi/libgame.so | grep -E 'accountID|gameVersion|binaryVersion|udid|userName|levelID|levelName|levelString|levelDesc|gjp|password|likeGJ|rateGJ|updateGJ|uploadGJ|downloadGJ|getGJ|boomlings' | sort -u | sed -n '1,500p' || true
          echo "=== DEX/SO files ==="
          find /tmp/gd10 -type f \( -name '*.dex' -o -name '*.so' -o -name '*.xml' \) -printf '%p %s bytes\n' | sort
