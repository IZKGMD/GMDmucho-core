name: Build patched Geometry Dash EXE

on:
  push:
    branches:
      - temp/gd-exe-patch-20260928
  workflow_dispatch:

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect client URLs
        shell: pwsh
        run: |
          $data = [IO.File]::ReadAllBytes("GeometryDash.exe")
          $ascii = [Text.Encoding]::ASCII.GetString($data)
          $patterns = @("boomlings","www\.","http://","https://","database","boomlings\.com")
          foreach ($p in $patterns) {
            Write-Host "=== $p ==="
            [regex]::Matches($ascii, ".{0,100}$p.{0,160}", [Text.RegularExpressions.RegexOptions]::IgnoreCase) |
              Select-Object -First 40 |
              ForEach-Object { Write-Host $_.Value }
          }

      - name: Patch GeometryDash.exe
        shell: pwsh
        run: |
          $path = "GeometryDash.exe"
          $target = [Text.Encoding]::ASCII.GetBytes("muchogdps.space")
          $candidates = @(
            [Text.Encoding]::ASCII.GetBytes("www.boomlings.com"),
            [Text.Encoding]::ASCII.GetBytes("boomlings.com")
          )

          $data = [IO.File]::ReadAllBytes($path)
          $total = 0

          foreach ($source in $candidates) {
            for ($i = 0; $i -le $data.Length - $source.Length; $i++) {
              $match = $true
              for ($j = 0; $j -lt $source.Length; $j++) {
                if ($data[$i + $j] -ne $source[$j]) {
                  $match = $false
                  break
                }
              }
              if ($match -and $target.Length -le $source.Length) {
                for ($j = 0; $j -lt $source.Length; $j++) { $data[$i + $j] = 0 }
                for ($j = 0; $j -lt $target.Length; $j++) { $data[$i + $j] = $target[$j] }
                $total++
                $i += $source.Length - 1
              }
            }
          }

          if ($total -eq 0) { throw "No supported endpoint hostname found" }
          [IO.File]::WriteAllBytes("GeometryDash-patched.exe", $data)
          Write-Host "Patched occurrences: $total"

      - name: Upload patched EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash-patched-muchogdps
          path: GeometryDash-patched.exe
          if-no-files-found: error
