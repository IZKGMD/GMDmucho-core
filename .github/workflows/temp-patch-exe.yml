name: Build patched Geometry Dash EXE

on:
  push:
    branches:
      - temp/gd-exe-patch-20260928
  workflow_dispatch:

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify client is patched for MuchoCore
        shell: pwsh
        run: |
          $data = [IO.File]::ReadAllBytes("GeometryDash.exe")
          $ascii = [Text.Encoding]::ASCII.GetString($data)

          $target = "muchogdps.space"
          $old1 = "www.boomlings.com"
          $old2 = "boomlings.com"

          $targetCount = ([regex]::Matches($ascii, [regex]::Escape($target), [Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count
          $oldCount1 = ([regex]::Matches($ascii, [regex]::Escape($old1), [Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count
          $oldCount2 = ([regex]::Matches($ascii, [regex]::Escape($old2), [Text.RegularExpressions.RegexOptions]::IgnoreCase)).Count

          Write-Host "MuchoCore hostname occurrences: $targetCount"
          Write-Host "www.boomlings.com occurrences: $oldCount1"
          Write-Host "boomlings.com occurrences: $oldCount2"

          if ($targetCount -lt 1) { throw "No muchogdps.space URLs found in GeometryDash.exe" }

      - name: Prepare patched EXE
        shell: pwsh
        run: |
          Copy-Item "GeometryDash.exe" "GeometryDash-patched.exe" -Force
          $hash = (Get-FileHash "GeometryDash-patched.exe" -Algorithm SHA256).Hash
          $size = (Get-Item "GeometryDash-patched.exe").Length
          Write-Host "Prepared GeometryDash-patched.exe"
          Write-Host "SHA256: $hash"
          Write-Host "Size: $size bytes"

      - name: Upload patched EXE
        uses: actions/upload-artifact@v4
        with:
          name: GeometryDash-patched-muchogdps
          path: GeometryDash-patched.exe
          if-no-files-found: error
