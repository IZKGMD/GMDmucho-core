name: Prepare MuchoCore brand assets

on:
  push:
    paths:
      - assets/brand/sources/Gemini_Generated_Image_af007baf007baf00.jpg
      - .github/workflows/brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - name: Build logo assets from the source sprite sheet
        shell: bash
        run: |
          set -euo pipefail

          SRC="assets/brand/sources/Gemini_Generated_Image_af007baf007baf00.jpg"
          mkdir -p public/assets

          # Main horizontal MuchoCore mark from the dark presentation panel.
          convert "$SRC"             -crop 1280x600+100+740 +repage             -resize "1400x>"             -strip             -quality 92             -interlace Plane             public/assets/muchocore-logo.jpg

          # Source artwork is 2048x2048; use native coordinates, not preview pixels.
          # Compact MC cube mark from the dedicated icon panel.
          convert "$SRC"             -crop 500x500+1490+95 +repage             -resize "256x256"             -strip             public/assets/muchocore-icon.png

          test -s public/assets/muchocore-logo.jpg
          test -s public/assets/muchocore-icon.png

          identify public/assets/muchocore-logo.jpg
          identify public/assets/muchocore-icon.png

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/assets/muchocore-logo.jpg public/assets/muchocore-icon.png

          if git diff --cached --quiet; then
            echo "Brand assets are already current."
            exit 0
          fi

          git commit -m "chore: add cropped MuchoCore brand assets"
          git push
