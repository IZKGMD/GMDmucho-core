name: Prepare MuchoCore brand assets

on:
  push:
    paths:
      - assets/brand/sources/Gemini_Generated_Image_af007baf007baf00.jpg
      - .github/workflows/brand-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -version

      - name: Build logo assets from the source sprite sheet
        shell: bash
        run: |
          set -euo pipefail

          SRC="assets/brand/sources/Gemini_Generated_Image_af007baf007baf00.jpg"
          mkdir -p public/assets

          # The horizontal wordmark keeps its dark branded background for
          # OpenGraph preview cards, never square navbar positions.
          convert "$SRC" -crop 1280x600+100+740 +repage \
            -resize "1400x>" -strip -quality 92 -interlace Plane \
            public/assets/muchocore-logo.jpg

          # Only the *connected outer* near-white area becomes transparent.
          # The white surfaces INSIDE the cube's dark outline stay intact.
          convert "$SRC" -crop 500x500+1490+95 +repage \
            -alpha on -fuzz 18% -fill none \
            -draw 'matte 0,0 floodfill' \
            -resize "256x256" -strip \
            PNG32:public/assets/muchocore-icon.png

          # A separate, versioned favicon path defeats Chrome's persistent
          # favicon cache. The legacy /favicon.ico also uses the same alpha
          # cube instead of the old white JPEG-backed badge.
          convert public/assets/muchocore-icon.png -resize 64x64 -strip \
            PNG32:public/assets/muchocore-favicon-v4.png
          convert public/assets/muchocore-icon.png \
            -define icon:auto-resize=64,48,32,16 public/favicon.ico

          test -s public/assets/muchocore-logo.jpg
          test -s public/assets/muchocore-icon.png
          test -s public/assets/muchocore-favicon-v4.png
          test -s public/favicon.ico
          identify public/assets/muchocore-logo.jpg
          identify public/assets/muchocore-icon.png

          # Verify the result is no longer fully opaque and has alpha.
          opaque="$(identify -format '%[opaque]' public/assets/muchocore-icon.png)"
          test "${opaque,,}" = "false"
          identify -format '%[channels]' public/assets/muchocore-icon.png | grep -qi 'a'
          favicon_opaque="$(identify -format '%[opaque]' public/assets/muchocore-favicon-v4.png)"
          test "${favicon_opaque,,}" = "false"
          test "$(identify public/favicon.ico | wc -l)" -eq 4

      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/assets/muchocore-logo.jpg public/assets/muchocore-icon.png \
            public/assets/muchocore-favicon-v4.png public/favicon.ico

          if git diff --cached --quiet; then
            echo "Brand assets are already current."
            exit 0
          fi

          git commit -m "chore: generate transparent MuchoCore brand icon"
          git push
