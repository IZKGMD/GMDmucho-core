name: Release stable

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check release marker
        id: marker
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          if [[ -f ".release/${TAG}-archive.ready" ]]; then
            echo "archive_only=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f ".release/${TAG}.ready" ]]; then
            echo "archive_only=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "archive_only=false" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish validated release
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.marker.outputs.version }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
            if [[ "$EXISTING_SHA" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $TAG already points to $EXISTING_SHA, refusing to move a stable release tag." >&2
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          fi

          awk -v tag="$TAG" '
            $0 ~ "^## " tag "$" {printing=1; print; next}
            printing && $0 ~ "^## " {exit}
            printing {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists."
          else
            gh release create "$TAG" \
              --title "MuchoCore $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          rm -f RELEASE_NOTES.md

      - name: Build source archive
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git archive --format=zip --prefix="MuchoCore-${TAG}/" "$TAG" -o "MuchoCore-${TAG}.zip"
          test -s "MuchoCore-${TAG}.zip"

      - name: Upload source archive
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          gh release upload "$TAG" "MuchoCore-${TAG}.zip" --clobber

      - name: Remove one-time release marker
        if: steps.marker.outputs.ready == 'true'
        env:
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f ".release/${TAG}.ready"
          if git diff --quiet -- ".release/${TAG}.ready"; then
            echo "Release marker already absent."
            exit 0
          fi
          git add -A ".release/${TAG}.ready"
          git commit -m "chore: finalize ${TAG} release marker"
          git push origin main

      - name: Remove one-time archive marker
        if: steps.marker.outputs.archive_only == 'true'
        env:
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f ".release/${TAG}-archive.ready"
          if git diff --quiet -- ".release/${TAG}-archive.ready"; then
            echo "Archive marker already absent."
            exit 0
          fi
          git add -A ".release/${TAG}-archive.ready"
          git commit -m "chore: finalize ${TAG} source archive"
          git push origin main
