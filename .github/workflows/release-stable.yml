name: Release stable

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-stable-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for release-marker detection
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
          persist-credentials: false

      - name: Verify release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [[ -z "${RELEASE_TOKEN}" ]]; then
            echo "ERROR: RELEASE_TOKEN repository secret is required for stable releases." >&2
            exit 1
          fi

      - name: Check release marker
        id: marker
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"

          ARCHIVE_MARKER="$(find .release -maxdepth 1 -type f -name 'archive-v*.ready' -print -quit 2>/dev/null || true)"
          if [[ -n "$ARCHIVE_MARKER" ]]; then
            TAG="$(basename "$ARCHIVE_MARKER")"
            TAG="${TAG#archive-}"
            TAG="${TAG%.ready}"
            echo "archive_only=true" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! -f ".release/${TAG}.ready" ]]; then
            echo "archive_only=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "archive_only=false" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve validated commit
        id: source
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          RELEASE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TRIGGER_RUN_ID" --jq '.head_sha')"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: unable to resolve the validated commit SHA." >&2
            exit 1
          }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          git fetch origin "$RELEASE_SHA"
          CURRENT_MAIN_SHA="$(git ls-remote origin "refs/heads/main" | awk 'NR == 1 {print $1}')"
          [[ "$CURRENT_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "ERROR: unable to resolve the current main branch SHA." >&2
            exit 1
          }
          if [[ "$CURRENT_MAIN_SHA" != "$RELEASE_SHA" ]]; then
            echo "ERROR: main advanced after the validated run ($RELEASE_SHA -> $CURRENT_MAIN_SHA)." >&2
            echo "This release workflow will stop; the newer commit must pass Validate before it can be published." >&2
            exit 1
          fi
          git checkout --detach "$RELEASE_SHA"

      - name: Verify MuchoCore 1.1.0 endpoint certification
        if: steps.marker.outputs.ready == 'true' && steps.marker.outputs.version == '1.1.0'
        run: php tests/release/v110-endpoint-gate.php

      - name: Publish validated release
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
          VERSION: ${{ steps.marker.outputs.version }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git config user.name "IZK"
          git config user.email "112145870+IZKGMD@users.noreply.github.com"
          gh auth setup-git
          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            EXISTING_SHA="$(git rev-parse "$TAG^{commit}")"
            if [[ "$EXISTING_SHA" != "$RELEASE_SHA" ]]; then
              echo "ERROR: $TAG already points to $EXISTING_SHA, refusing to move a stable release tag." >&2
              exit 1
            fi
          else
            git tag "$TAG" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG:refs/tags/$TAG"
          fi

          awk -v tag="$TAG" '
            $0 ~ "^## " tag "( |$)" {printing=1; print; next}
            printing && $0 ~ "^## " {exit}
            printing {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists."
          else
            gh release create "$TAG" \
              --title "MuchoCore $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          rm -f RELEASE_NOTES.md

      - name: Prepare shared-hosting dependencies
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        run: |
          composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Build shared-hosting package
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          VERSION: ${{ steps.marker.outputs.version }}
          OUTPUT: MuchoCore-v${{ steps.marker.outputs.version }}-shared-hosting.zip
        run: |
          bash tools/release/build-shared-hosting.sh
          unzip -t "$OUTPUT" >/dev/null
          test -s "$OUTPUT"

      - name: Upload shared-hosting package
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          gh release upload "$TAG" "MuchoCore-v${TAG#v}-shared-hosting.zip" --clobber
      - name: Build source archive
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git archive --format=zip --prefix="MuchoCore-${TAG}/" -o "MuchoCore-${TAG}.zip" "$TAG" -- \
            . \
            ':(exclude)Geometry.Dash.ver.1.40.build.11.apk' \
            ':(exclude)assets/brand/sources/**' \
            ':(exclude).release/**'
          test -s "MuchoCore-${TAG}.zip"

      - name: Upload source archive
        if: steps.marker.outputs.ready == 'true' || steps.marker.outputs.archive_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          gh release upload "$TAG" "MuchoCore-${TAG}.zip" --clobber

      - name: Remove one-time release marker
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          gh auth setup-git
          rm -f ".release/${TAG}.ready"
          if git diff --quiet -- ".release/${TAG}.ready"; then
            echo "Release marker already absent."
            exit 0
          fi
          git add -A ".release/${TAG}.ready"
          git commit -m "chore: finalize ${TAG} release marker"
          git push origin main

      - name: Remove one-time archive marker
        if: steps.marker.outputs.archive_only == 'true'
        env:
          TAG: ${{ steps.marker.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          git config user.name "IZK"
          git config user.email "112145870+IZKGMD@users.noreply.github.com"
          gh auth setup-git
          git fetch origin main
          git switch -C main origin/main
          rm -f ".release/archive-${TAG}.ready"
          if git diff --quiet -- ".release/archive-${TAG}.ready"; then
            echo "Archive marker already absent."
            exit 0
          fi
          git add -A ".release/archive-${TAG}.ready"
          git commit -m "chore: finalize ${TAG} source archive"
          git push origin main
