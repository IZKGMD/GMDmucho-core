name: Release stable

on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check release marker
        id: marker
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v${VERSION}"
          if [[ ! -f ".release/${TAG}.ready" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish validated release
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ steps.marker.outputs.version }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$RELEASE_SHA"
          git push origin +refs/tags/"$TAG"

          awk -v tag="$TAG" '
            $0 ~ "^## " tag "$" {printing=1; print; next}
            printing && $0 ~ "^## " {exit}
            printing {print}
          ' CHANGELOG.md > RELEASE_NOTES.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists."
          else
            gh release create "$TAG" \
              --title "MuchoCore $TAG" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi

          rm -f RELEASE_NOTES.md

      - name: Remove one-time release marker
        if: steps.marker.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.marker.outputs.tag }}
        run: |
          git fetch origin main
          git switch -C main origin/main
          rm -f ".release/${TAG}.ready"
          if git diff --quiet -- ".release/${TAG}.ready"; then
            echo "Release marker already absent."
            exit 0
          fi
          git add -A ".release/${TAG}.ready"
          git commit -m "chore: finalize ${TAG} release marker"
          git push origin main
