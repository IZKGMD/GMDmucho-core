name: MuchoCore Remote Bridge

on:
  pull_request:
    paths:
      - 'remote_bridge/**'
      - 'docker-compose.yml'
      - 'docker/Caddyfile'
      - '.github/workflows/remote-bridge.yml'
  push:
    branches: [main]
    paths:
      - 'remote_bridge/**'
      - 'docker-compose.yml'
      - 'docker/Caddyfile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r remote_bridge/requirements.txt -r remote_bridge/test_requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q remote_bridge
      - name: Run API and deployment tests
        run: pytest -q remote_bridge/tests
      - name: Build isolated bridge image
        run: docker build --tag muchocore-remote-bridge:test -f remote_bridge/Dockerfile .

  windows-agent:
    name: Build standalone Windows agent package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Windows agent dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r remote_bridge/windows_requirements.txt pyinstaller
      - name: Build standalone Windows executables
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name MuchoCoreRemoteAgent --paths remote_bridge --hidden-import ftp_client --hidden-import keyring.backends.Windows --collect-all pyautogui --collect-all pyperclip --collect-all keyring --collect-all psutil remote_bridge/agent.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name MuchoCoreRemoteSetup --hidden-import keyring.backends.Windows --collect-all keyring remote_bridge/agent_setup.py
          python -m PyInstaller --noconfirm --clean --onefile --console --name MuchoCoreRemoteFTPSSetup --hidden-import keyring.backends.Windows --collect-all keyring remote_bridge/configure_ftp.py
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item dist/MuchoCoreRemoteAgent.exe dist/package/
          Copy-Item dist/MuchoCoreRemoteSetup.exe dist/package/
          Copy-Item dist/MuchoCoreRemoteFTPSSetup.exe dist/package/
          Copy-Item remote_bridge/README_RU.md dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath dist/MuchoCoreRemoteBridge-Windows-x64.zip -Force
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MuchoCoreRemoteBridge-Windows-x64
          path: dist/MuchoCoreRemoteBridge-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
