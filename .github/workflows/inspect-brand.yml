name: Inspect MuchoCore sprite

on:
  push:
    paths:
      - Gemini_Generated_Image_af007baf007baf00.jpg
      - .github/workflows/inspect-brand.yml
      - tools/.tmp/inspect-trigger.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create inspect images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools/.tmp
          convert Gemini_Generated_Image_af007baf007baf00.jpg \
            -auto-orient \
            -resize '1800x1800>' \
            -strip \
            tools/.tmp/brand-inspect.jpg

          convert tools/.tmp/brand-inspect.jpg \
            -resize 1600x1600 \
            tools/.tmp/brand-inspect-preview.png

      - name: Upload sprite inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: muchocore-sprite-inspection
          path: |
            tools/.tmp/brand-inspect.jpg
            tools/.tmp/brand-inspect-preview.png
          if-no-files-found: error
          retention-days: 1
