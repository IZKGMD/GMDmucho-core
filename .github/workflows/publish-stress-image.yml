name: Publish stress runtime image

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile"
      - "docker/app-entrypoint.sh"
      - "docker/php-performance.ini"
      - "bin/php-runtime-security.php"
      - ".github/workflows/publish-stress-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish patched PHP runtime for isolated VPS stress tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: |
            ghcr.io/izkgmd/gmdmucho-core:stress
            ghcr.io/izkgmd/gmdmucho-core:stress-${{ github.sha }}
          cache-from: type=gha,scope=muchocore-stress-runtime
          cache-to: type=gha,mode=max,scope=muchocore-stress-runtime
