name: Remove accidental v1.1.0 release object

on:
  push:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Delete accidental release object
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "RELEASE_TOKEN is required." >&2
            exit 1
          fi

          RELEASE_IDS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.name == "MuchoCore v1.1.0" or .tag_name == "v1.1.0") | .id')"
          if [[ -z "$RELEASE_IDS" ]]; then
            echo "Accidental v1.1.0 release object is already absent."
            exit 0
          fi

          while IFS= read -r release_id; do
            [[ -z "$release_id" ]] && continue
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id" >/dev/null
            echo "Deleted release object $release_id."
          done <<< "$RELEASE_IDS"
