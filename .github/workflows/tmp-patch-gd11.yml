name: Temporary GD 1.1 APK patch

on:
  push:

jobs:
  patch-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP and Android APK tooling
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends android-sdk-build-tools

      - name: Patch GD 1.1 APK
        run: |
          mkdir -p build
          php -r '
            require "src/Client/WindowsClientPatcher.php";
            require "src/Client/AndroidClientPatcher.php";
            $result = MuchoCore\\Client\\AndroidClientPatcher::patchFile(
                "Geometry.Dash.ver.1.1.build.5 (1).apk",
                "build/Geometry.Dash.ver.1.1.build.5-MuchoCore.apk",
                "https://muchogdps.space"
            );
            file_put_contents("build/patch-report.json", json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
            echo json_encode($result, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL;
          '

      - name: Verify APK output
        run: |
          test -s build/Geometry.Dash.ver.1.1.build.5-MuchoCore.apk
          apksigner verify --verbose build/Geometry.Dash.ver.1.1.build.5-MuchoCore.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: gd11-muchocore-patched
          path: |
            build/Geometry.Dash.ver.1.1.build.5-MuchoCore.apk
            build/patch-report.json
          if-no-files-found: error
