name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n uninstall.sh
          for f in tests/*.sh; do bash -n "$f"; done

      - name: Check PHP sources
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/client-compatibility.php
          php tests/router-compatibility.php

      - name: Check Python patcher
        run: |
          python3 -m py_compile tools/client-patch.py tools/client-trace-summary.py
          python3 tools/client-patch.py --self-test

      - name: Check Windows client patcher
        shell: pwsh
        run: ./tools/client-patcher.ps1 -SelfTest

      - name: Check for fixed personal GDPS domain
        run: |
          ! git grep -niE 'muchogdps[.]space' --             ':!.github/workflows/validate.yml'

      - name: Check required files
        run: |
          test -f docker-compose.yml
          test -f docker/Dockerfile
          test -f docker/Caddyfile
          test -f docker/app-entrypoint.sh
          test -f tools/client-patch.bat
          test -f tools/client-patcher.ps1

      - name: Check runtime environment handling
        run: |
          ! grep -q 'cat > .env' docker/app-entrypoint.sh
          grep -q '/var/lib/muchocore/runtime.env' docker/app-entrypoint.sh
          grep -q 'createMutable' src/Database/Database.php
          grep -q 'root:www-data' docker/app-entrypoint.sh

      - name: Check admin container routing
        run: |
          grep -q "http://caddy" public/admin/index.php
          ! grep -q "http://127.0.0.1" public/admin/index.php
          ! grep -q "Host: muchogdps.space" public/admin/index.php

      - name: Check Caddy configuration
        run: |
          ! grep -Eq '/database/\*' docker/Caddyfile
          docker run --rm             -e DOMAIN=gdps.example.com             -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2.10-alpine             caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check client contract helper
        run: bash tests/client-contract.sh

  publish-release:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v1.0.1 --title "MuchoCore v1.0.1" --target "$GITHUB_SHA" --notes "Includes the complete MuchoCore source tree, including the Windows client patcher tools."
