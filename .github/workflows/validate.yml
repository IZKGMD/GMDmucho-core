name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, zip
          tools: composer

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n install
          bash -n update.sh
          bash -n docker/app-entrypoint.sh
          ! grep -nE '\\\$[0-9]+' install.sh
          bash -n uninstall.sh
          find tests -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - name: Validate Composer manifest
        run: composer validate --strict --no-check-publish

      - name: Audit Composer dependencies
        run: composer audit --no-dev --locked --format=plain

      - name: Install Android APK tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends android-sdk-build-tools

      - name: Check PHP sources
        run: |
          find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/client/client-compatibility.php
          php tests/client/client-ip.php
          php tests/protocol/protocol-matrix.php
          php tests/protocol/compatibility-profile.php
          php tests/protocol/v71-request.php
          php tests/protocol/legacy-text.php
          php tests/protocol/protocol-19-surface.php
          php tests/protocol/protocol-19-wire.php
          php tests/protocol/social-wire.php
          php tests/protocol/level-protocol-guards.php
          php tests/protocol/protocol-22-hashes.php
          php tests/protocol/protocol-22-surface.php
          php tests/protocol/protocol-20-surface.php
          php tests/protocol/protocol-20-wire.php
          php tests/protocol/protocol-21-surface.php
          php tests/protocol/protocol-21-wire.php
          php tests/protocol/router-compatibility.php
          php tests/application/game-roles.php
          php tests/application/admin-rating-contract.php
          php tests/application/admin-2fa-contract.php
          php tests/application/admin-access-key-contract.php
          php tests/application/admin-passkey-contract.php
          php tests/application/admin-password-setup-contract.php
          php tests/application/admin-rbac-contract.php
          php tests/application/plugin-sdk-contract.php
          php tests/application/score-integrity-contract.php
          php tests/application/cvolton-db-import-contract.php
          php tests/application/comment-contract.php
          php tests/application/legacy-19-session.php
          php tests/application/security-regressions.php
          bash tests/release/release-update-detection.sh
          php tests/database/migrator-concurrency.php
          php tests/application/music-upload-contract.php
          php tests/security/turnstile.php
          php tests/client/client-trace.php
          php tests/security/muchoprotect.php
          php tests/client/windows-client-patcher.php
          php tests/client/android-client-patcher.php

      - name: Check Python patcher
        run: |
          python3 -m py_compile tools/client/client-patch.py tools/client/client-trace-summary.py tests/client/client-patcher-fixture.py
          python3 tools/client/client-patch.py --self-test
          python3 tests/client/client-patcher-fixture.py

      - name: Check required files
        run: |
          test -f VERSION
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.1"
          test -f CHANGELOG.md
          test -f docker-compose.yml
          test -f docker-compose.tunnel.yml
          test -f install
          test -f docker/Dockerfile
          test -f docker/Caddyfile
          test -f docker/app-entrypoint.sh
          test -f tools/client/client-patch.bat
          test -f tools/client/client-patch.py
          test -f tools/client/client-patcher.ps1
          test -f auto-update.sh
          test -f bin/mucho-install-auto-update.sh
          test -f docs/AUTO_UPDATE.md
          test -f docs/ADMIN_RBAC.md

      - name: Check Docker Compose configuration
        run: |
          trap 'rm -rf .secrets .ci.env' EXIT
          mkdir -p .secrets
          printf 'ci-db-password' > .secrets/db_password
          printf 'ci-db-root-password' > .secrets/db_root_password
          printf 'ci-admin-password' > .secrets/admin_password
          printf 'ci-testgdps-db-password' > .secrets/testgdps_db_password
          printf 'ci-testgdps-db-root-password' > .secrets/testgdps_db_root_password
          printf 'ci-testgdps-admin-password' > .secrets/testgdps_admin_password
          cat > .ci.env <<'EOF'
          DOMAIN=gdps.example.com
          CADDY_ADDRESS="http://gdps.example.com http://www.gdps.example.com https://gdps.example.com https://www.gdps.example.com"
          DB_NAME=muchocore
          DB_USER=muchocore_user
          ADMIN_USER=admin
          MUCHO_ACCOUNT_URL=https://gdps.example.com
          MUCHO_CUSTOM_CONTENT_URL=https://geometrydashfiles.b-cdn.net
          MUCHO_ADMIN_BOOTSTRAP=/etc/muchocore-admin.php
          MUCHO_CONTROL_DIR=/var/lib/muchocore-control
          MUCHO_BACKUP_DIR=/var/lib/muchocore-backups
          TZ=UTC
          MUCHO_TUNNEL_TOKEN=dummy-token
          CADDY_EXTRA_HOSTS=testgdps.muchogdps.space
          EOF
          docker compose --env-file .ci.env config -q
          docker compose --env-file .ci.env -f docker-compose.yml -f docker-compose.tunnel.yml config -q

      - name: Check release-based automatic update wiring
        run: |
          test -f auto-update.sh
          test -f bin/mucho-install-auto-update.sh
          test -f docs/AUTO_UPDATE.md
          grep -Fq 'MUCHO_AUTO_UPDATE=1' install.sh
          grep -Fq 'MUCHO_AUTO_UPDATE_INTERVAL=15min' install.sh
          grep -Fq 'refs/tags/$LATEST_RELEASE_TAG' install.sh
          grep -Fq 'releases/latest' update.sh
          grep -Fq 'releases/latest' auto-update.sh
          grep -Fq 'refs/tags/$LATEST_TAG' update.sh
          grep -Fq "'updates' => 'system.manage'" src/Admin/AdminRbac.php
          grep -Fq "'updates'=>'Core Updates'" public/admin/config/pages.php

      - name: Check runtime environment handling
        run: |
          ! grep -q 'cat > .env' docker/app-entrypoint.sh
          grep -q '/var/lib/muchocore/runtime.env' docker/app-entrypoint.sh
          grep -q 'createMutable' src/Database/Database.php
          grep -q 'root:www-data' docker/app-entrypoint.sh
          grep -q 'install -d -m 750 -o root -g www-data /var/lib/muchocore' docker/app-entrypoint.sh
          grep -q 'chown root:www-data /var/lib/muchocore/runtime.env' docker/app-entrypoint.sh

      - name: Check admin container routing
        run: |
          grep -q "http://caddy" public/admin/index.php
          ! grep -q "http://127.0.0.1" public/admin/index.php

      - name: Check Apache shared-hosting routing
        run: bash tests/integration/apache-routing.sh

      - name: Check hardened audit surfaces
        run: |
          grep -Fq 'handle_path /downloads/android/*' docker/Caddyfile
          grep -q 'docker-php-ext-install pdo_mysql opcache zip' docker/Dockerfile
          grep -q "clear_env = no" docker/Dockerfile
          grep -q 'MuchoProtect' src/V71/V71Application.php
          grep -q 'CompatibilityProfile' src/V71/V71Application.php
          grep -q 'FOR UPDATE' public/admin/client-release-upload-module.php
          test -f database/migrations/20260924_002_integrity_hardening.php
          test -f database/migrations/20260924_003_v71_runtime_schema.php
          grep -Fq 'mucho_level_scores' database/migrations/20260924_003_v71_runtime_schema.php
          grep -Fq 'mucho_platformer_scores' database/migrations/20260924_003_v71_runtime_schema.php
          grep -Fq 'mucho_level_lists' database/migrations/20260924_003_v71_runtime_schema.php
          grep -Fq "preg_match('/^-?\d+$/D'" src/V71/Request.php

      - name: Check public liveness routing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("public/index.php").read_text(encoding="utf-8")
          liveness = source.index("if (")
          application = source.index("(new Application())->run();")
          assert "__muchoLivenessPath" in source
          assert "/health" in source
          assert "/checkifserveronline" in source
          assert liveness < application
          PY
          ! grep -q 'Gemini_Generated_Image_vemzsvemzsvemzsv.jpg' docker/Caddyfile
          grep -Fq '@legacy_recovery path /GD/accountHelp /GD/accountHelp.php' docker/Caddyfile
          grep -Fq 'rewrite * /api/api/accounts/lostusername.php' docker/Caddyfile
          grep -Fq 'path /.env* /.git/* /composer.json /composer.lock /config/* /src/* /tests/* /storage/*' docker/Caddyfile
          grep -Fq 'auto_https disable_redirects' docker/Caddyfile
          grep -Fq 'testgdps.muchogdps.space' docker/Caddyfile
          grep -Fq 'testgdps-app:9000' docker/Caddyfile
          grep -Fq 'testgdps-db' docker-compose.yml
          grep -Fq 'testgdps-app' docker-compose.yml
          grep -Fq 'path /admin /admin/*' docker/Caddyfile
          grep -Fq 'redir @admin_http https://{host}{uri} 308' docker/Caddyfile
          test -s public/assets/muchocore-logo.jpg

      - name: Check Caddy configuration
        run: |
          ! grep -Eq '/database/\\*' docker/Caddyfile
          docker run --rm \
            -e DOMAIN=gdps.example.com \
            -e CADDY_ADDRESS='http://gdps.example.com http://www.gdps.example.com https://gdps.example.com https://www.gdps.example.com' \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            -e DOMAIN=gdps.example.com \
            -e CADDY_ADDRESS='http://gdps.example.com http://www.gdps.example.com https://gdps.example.com https://www.gdps.example.com' \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine \
            caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); ls={p for s in d["apps"]["http"]["servers"].values() for p in s["listen"]}; assert ":80" in ls and ":443" in ls, ls'

      - name: Check client contract helper
        run: bash tests/client/client-contract.sh

      # The stable release is gated only by real-client fixtures that are
      # actually committed to the repository.  2.2 has a verified fixture;
      # legacy 1.9/2.0/2.1 fixtures are not present, so those gates must not
      # be bypassed with synthetic data. Their protocol regressions remain
      # covered above.
      - name: Check 2.2 release gate
        run: bash tests/release/release-2.2-gate.sh

      - name: Check 1.9 release gate when fixture is present
        if: startsWith(github.ref, 'refs/tags/v1.0.1') && hashFiles('tests/client-fixtures/1.9/endpoints.json') != ''
        run: bash tests/release/release-1.9-gate.sh

      - name: Check 2.0 release gate when fixture is present
        if: startsWith(github.ref, 'refs/tags/v1.0.0') && hashFiles('tests/client-fixtures/2.0/endpoints.json') != ''
        run: bash tests/release/release-2.0-gate.sh

      - name: Check 2.1 release gate when fixture is present
        if: startsWith(github.ref, 'refs/tags/v1.0.0') && hashFiles('tests/client-fixtures/2.1/endpoints.json') != ''
        run: bash tests/release/release-2.1-gate.sh

  windows-patcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Windows PowerShell patcher self-test
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/client/client-patcher.ps1 -SelfTest
