name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  source-archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Build source archive
        run: |
          git archive             --format=zip             --output=mucho-core.zip             "${{ github.event.release.tag_name }}"

      - name: Upload source archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload             "${{ github.event.release.tag_name }}"             mucho-core.zip             --repo "${{ github.repository }}"             --clobber
