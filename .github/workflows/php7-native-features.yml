name: Native PHP7 feature integration

on:
  push:
    branches: [main]
    paths: ['compat/php7/**', 'public/php7*.php', 'public/assets/php7-*.js', 'public/assets/php7-admin.css', 'tests/compat/php7-native-*', 'tests/compat/php7-shared-*', 'tests/compat/shared-patcher-*', '.github/workflows/php7-native-features.yml']
  pull_request:
    paths: ['compat/php7/**', 'public/php7*.php', 'public/assets/php7-*.js', 'public/assets/php7-admin.css', 'tests/compat/php7-native-*', 'tests/compat/php7-shared-*', 'tests/compat/shared-patcher-*', '.github/workflows/php7-native-features.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.0', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: native-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd
          coverage: none
      - name: Check native syntax and pure protocol behavior
        run: |
          for src in $(find compat/php7 -name '*.php') public/php7*.php; do
            php -l "$src"
          done
          php tests/compat/php7-native-features-pure.php
          php tests/compat/php7-compiled-domain-pure.php
          php tests/compat/php7-aead-compat.php
          php tests/compat/php7-core-pack.php
          php tests/compat/php7-content-proxy.php
          python3 tests/compat/shared-patcher-download.py
      - name: Install independent Android verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y apksigner zipalign aapt
      - name: Verify shared-only APK signing with process functions disabled
        run: |
          python3 tests/compat/shared-patcher-fixture.py "$RUNNER_TEMP/shared-fixture.apk"
          SHARED_PATCHER_APK_FIXTURE="$RUNNER_TEMP/shared-fixture.apk" \
          SHARED_PATCHER_TEST_ROOT="$RUNNER_TEMP/shared-patcher-${{ matrix.php }}" \
          php -d memory_limit=256M -d disable_functions=exec,shell_exec,system,passthru,proc_open,popen \
            tests/compat/php7-shared-patcher.php
          apksigner verify --min-sdk-version 21 --verbose "$RUNNER_TEMP/shared-patcher-${{ matrix.php }}/signed.apk" | tee "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v1 scheme (JAR signing): true' "$RUNNER_TEMP/signature.txt"
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/signature.txt"
          zipalign -c -p 4 "$RUNNER_TEMP/shared-patcher-${{ matrix.php }}/signed.apk"
          if apksigner verify --min-sdk-version 21 "$RUNNER_TEMP/shared-patcher-${{ matrix.php }}/tampered.apk"; then
            echo 'Tampered APK passed independent verification' >&2
            exit 1
          fi
      - name: Check real database behavior on native and modern PHP
        env:
          TEST_DB_ROOT_PASSWORD: native-ci-only
          TEST_DB_HOST: 127.0.0.1
        run: |
          php -d memory_limit=128M tests/compat/php7-native-mysql.php
          php -d memory_limit=128M tests/compat/php7-native-features-mysql.php
          php -d memory_limit=128M tests/compat/php7-native-social-admin-mysql.php
          php -d memory_limit=128M tests/compat/php7-native-social-mysql.php
          NATIVE_SOCIAL_LEGACY=1 php -d memory_limit=128M tests/compat/php7-native-social-mysql.php
          php -d memory_limit=128M tests/compat/php7-native-admin-registry.php --mysql
          php -d memory_limit=128M tests/compat/php7-native-news-security.php --mysql
          php -d memory_limit=128M tests/compat/php7-original-schema-upgrade.php
          php -d memory_limit=128M tests/compat/php7-original-schema-upgrade.php --legacy
      - name: Exercise compiled original core features on PHP7 and modern PHP
        env:
          TEST_DB_ROOT_PASSWORD: native-ci-only
          TEST_DB_HOST: 127.0.0.1
        run: |
          for test in compat/php7/core/tests/application/*-integration.php; do
            php -d memory_limit=128M "$test"
          done
