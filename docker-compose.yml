services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      MUCHO_DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USER: ${ADMIN_USER}
      MUCHO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      MUCHO_ACCOUNT_URL: ${MUCHO_ACCOUNT_URL}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      MUCHO_CUSTOM_CONTENT_URL: ${MUCHO_CUSTOM_CONTENT_URL}
      MUCHO_ADMIN_BOOTSTRAP: ${MUCHO_ADMIN_BOOTSTRAP:-/etc/muchocore-admin.php}
      MUCHO_CONTROL_DIR: ${MUCHO_CONTROL_DIR:-/var/lib/muchocore-control}
      MUCHO_BACKUP_DIR: ${MUCHO_BACKUP_DIR:-/var/lib/muchocore-backups}
      MUCHO_CLIENT_TRACE: ${MUCHO_CLIENT_TRACE:-0}
      MUCHO_CLIENT_TRACE_FILE: ${MUCHO_CLIENT_TRACE_FILE:-/var/www/mucho-core/storage/client-trace.ndjson}
      MUCHO_GD_VERSIONS: ${MUCHO_GD_VERSIONS:-all}
    secrets:
      - db_password
      - admin_password
      - cloudsave_key
    volumes:
      - ./:/var/www/mucho-core
      - muchocore_runtime:/var/lib/muchocore
    depends_on:
      db:
        condition: service_healthy

  # First hosted MuchoCore tenant. It intentionally uses isolated MariaDB
  # storage, runtime state and administrator credentials while sharing the
  # immutable application source tree with the main instance.
  testgdps-db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: testgdps
      MARIADB_USER: testgdps
      MARIADB_PASSWORD_FILE: /run/secrets/testgdps_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/testgdps_db_root_password
    secrets:
      - testgdps_db_password
      - testgdps_db_root_password
    volumes:
      - testgdps_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/testgdps_db_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  testgdps-app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: testgdps-db
      DB_PORT: 3306
      DB_NAME: testgdps
      DB_USER: testgdps
      MUCHO_DB_PASSWORD_FILE: /run/secrets/testgdps_db_password
      ADMIN_USER: testowner
      MUCHO_ADMIN_PASSWORD_FILE: /run/secrets/testgdps_admin_password
      MUCHO_ACCOUNT_URL: https://testgdps.muchogdps.space
      MUCHO_CUSTOM_CONTENT_URL: ${MUCHO_CUSTOM_CONTENT_URL}
      MUCHO_ADMIN_BOOTSTRAP: /etc/muchocore-admin.php
      MUCHO_CONTROL_DIR: /var/lib/muchocore-test-control
      MUCHO_BACKUP_DIR: /var/lib/muchocore-test-backups
      MUCHO_CLIENT_TRACE: 0
      MUCHO_CLIENT_TRACE_FILE: /var/www/mucho-core/storage/testgdps-client-trace.ndjson
      MUCHO_GD_VERSIONS: all
    secrets:
      - testgdps_db_password
      - testgdps_admin_password
    volumes:
      - ./:/var/www/mucho-core
      - muchocore_testgdps_runtime:/var/lib/muchocore
    depends_on:
      testgdps-db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_ADDRESS: ${CADDY_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/var/www/mucho-core:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - testgdps-app

secrets:
  db_password:
    file: ./.secrets/db_password
  db_root_password:
    file: ./.secrets/db_root_password
  admin_password:
    file: ./.secrets/admin_password
  cloudsave_key:
    file: ./.secrets/cloudsave_key
  testgdps_db_password:
    file: ./.secrets/testgdps_db_password
  testgdps_db_root_password:
    file: ./.secrets/testgdps_db_root_password
  testgdps_admin_password:
    file: ./.secrets/testgdps_admin_password

volumes:
  db_data:
  caddy_data:
  caddy_config:
  muchocore_runtime:
  testgdps_db_data:
  muchocore_testgdps_runtime:
