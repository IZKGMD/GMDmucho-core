services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_password
      - db_root_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$$(cat /run/secrets/db_root_password)\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      MUCHO_DB_PASSWORD_FILE: /run/secrets/db_password
      ADMIN_USER: ${ADMIN_USER}
      MUCHO_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      MUCHO_ACCOUNT_URL: ${MUCHO_ACCOUNT_URL}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      MUCHO_CUSTOM_CONTENT_URL: ${MUCHO_CUSTOM_CONTENT_URL}
      MUCHO_ADMIN_BOOTSTRAP: ${MUCHO_ADMIN_BOOTSTRAP:-/etc/muchocore-admin.php}
      MUCHO_CONTROL_DIR: ${MUCHO_CONTROL_DIR:-/var/lib/muchocore-control}
      MUCHO_BACKUP_DIR: ${MUCHO_BACKUP_DIR:-/var/lib/muchocore-backups}
      MUCHO_CLIENT_TRACE: ${MUCHO_CLIENT_TRACE:-0}
      MUCHO_CLIENT_TRACE_FILE: ${MUCHO_CLIENT_TRACE_FILE:-/var/www/mucho-core/storage/client-trace.ndjson}
      MUCHO_GD_VERSIONS: ${MUCHO_GD_VERSIONS:-all}
      MUCHO_CACHE_DRIVER: ${MUCHO_CACHE_DRIVER:-database}
      MUCHO_LEVEL_CACHE_TTL: ${MUCHO_LEVEL_CACHE_TTL:-15}
      MUCHO_REDIS_HOST: ${MUCHO_REDIS_HOST:-127.0.0.1}
      MUCHO_REDIS_PORT: ${MUCHO_REDIS_PORT:-6379}
      MUCHO_REDIS_PASSWORD: ${MUCHO_REDIS_PASSWORD:-}
      MUCHO_REDIS_DATABASE: ${MUCHO_REDIS_DATABASE:-0}
      MUCHO_WEBHOOK_URL: ${MUCHO_WEBHOOK_URL:-}
      MUCHO_WEBHOOK_SECRET: ${MUCHO_WEBHOOK_SECRET:-}
      MUCHO_WEBHOOK_EVENTS: ${MUCHO_WEBHOOK_EVENTS:-*}
    secrets:
      - db_password
      - admin_password
      - cloudsave_key
    volumes:
      - ./:/var/www/mucho-core
      - muchocore_runtime:/var/lib/muchocore
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    command: ["php", "/var/www/mucho-core/bin/mucho-worker.php", "--loop", "--sleep=2"]
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      MUCHO_DB_PASSWORD_FILE: /run/secrets/db_password
      MUCHO_SKIP_ADMIN_BOOTSTRAP: "1"
      MUCHO_CACHE_DRIVER: ${MUCHO_CACHE_DRIVER:-database}
      MUCHO_REDIS_HOST: ${MUCHO_REDIS_HOST:-127.0.0.1}
      MUCHO_REDIS_PORT: ${MUCHO_REDIS_PORT:-6379}
      MUCHO_REDIS_PASSWORD: ${MUCHO_REDIS_PASSWORD:-}
      MUCHO_REDIS_DATABASE: ${MUCHO_REDIS_DATABASE:-0}
      MUCHO_WEBHOOK_URL: ${MUCHO_WEBHOOK_URL:-}
      MUCHO_WEBHOOK_SECRET: ${MUCHO_WEBHOOK_SECRET:-}
      MUCHO_WEBHOOK_EVENTS: ${MUCHO_WEBHOOK_EVENTS:-*}
    secrets:
      - db_password
    volumes:
      - ./:/var/www/mucho-core
      - muchocore_runtime:/var/lib/muchocore
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      CADDY_ADDRESS: ${CADDY_ADDRESS}
      # Canonical public MuchoCore product host. Tenant GDPS domains must not expose it.
      MUCHOCORE_SITE_HOST: ${MUCHOCORE_SITE_HOST:-disabled.invalid}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./:/var/www/mucho-core:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

secrets:
  db_password:
    file: ./.secrets/db_password
  db_root_password:
    file: ./.secrets/db_root_password
  admin_password:
    file: ./.secrets/admin_password
  cloudsave_key:
    file: ./.secrets/cloudsave_key
  muchocore_tunnel_token:
    file: ./.secrets/tunnel_token

volumes:
  db_data:
  caddy_data:
  caddy_config:
  muchocore_runtime:
